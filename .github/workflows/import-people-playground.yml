name: Import people-playground folder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-people-playground.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          repository: beans-jusfine/peple-playground
          ref: main
          path: destination
          persist-credentials: true

      - name: Check out source repository
        uses: actions/checkout@v4
        with:
          repository: bubbls/ugss
          path: source
          sparse-checkout: people-playground
          sparse-checkout-cone-mode: true

      - name: Copy folder contents and push
        working-directory: destination
        run: |
          cp -a ../source/people-playground/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "Import people-playground folder from bubbls/ugss"
          git push origin main
